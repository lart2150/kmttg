# Configuration cache: serializes the configured task graph and reuses it on
# subsequent builds, skipping the configuration phase. Verified compatible with
# all tasks here (shadow 9.x, jacoco, the custom JavaExec/Zip tasks).
org.gradle.configuration-cache=true

# Reuse task outputs across builds (and machines, if a remote cache is added).
org.gradle.caching=true

# Run independent tasks in parallel across CPU cores.
org.gradle.parallel=true
