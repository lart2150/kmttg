plugins {
    id 'application'
    id 'jacoco'  // code coverage report for the test suite
    // Produces the fat "uber" kmttg.jar (maintained fork of the shadow plugin)
    id 'com.gradleup.shadow' version '9.4.2'
}

group   = 'com.tivo.kmttg'
version = 'v2.11.0-rc1'

// ---------------------------------------------------------------------------
// Third party library versions - bump these to update a dependency. The jars
// are downloaded by Gradle from the repositories below and are NOT committed to git.
// ---------------------------------------------------------------------------
ext {
    httpclientVersion = '5.6.1'   // pulls httpcore5 transitively
    websocketVersion  = '1.6.0'
    flatlafVersion    = '3.7.1'
    miglayoutVersion  = '11.4.3'  // miglayout-swing pulls miglayout-core
    jmdnsVersion      = '3.6.3'
    tivolibreVersion  = '0.8.0'
    // Both are for the spawned tivolibre command line app, not for kmttg itself; see below
    commonsCliVersion = '1.11.0'
    logbackVersion    = '1.6.3'
}

repositories {
    mavenCentral()
    // tivolibre is not on Maven Central. This branch of the fork is a Maven repository, and
    // raw.githubusercontent.com serves it without authentication.
    maven {
        url = 'https://raw.githubusercontent.com/lart2150/tivolibre/maven/'
        content { includeGroup 'io.github.lart2150' }
    }
}

dependencies {
    implementation "org.apache.httpcomponents.client5:httpclient5:${httpclientVersion}"
    implementation "org.java-websocket:Java-WebSocket:${websocketVersion}"
    implementation "com.formdev:flatlaf:${flatlafVersion}"
    implementation "com.miglayout:miglayout-swing:${miglayoutVersion}"
    implementation "org.jmdns:jmdns:${jmdnsVersion}"

    // kmttg's TiVo .TiVo decoder library, from the repository declared above.
    implementation "io.github.lart2150:tivo-libre:${tivolibreVersion}"

    // TiVoTranscode and Transcode spawn
    //     java -cp kmttg.jar net.straylightlabs.tivolibre.DecoderApp
    // so the fat jar has to carry what that command line app needs, not just what the library
    // needs. tivolibre leaves them out of its own dependencies so that embedding it does not
    // drag in an argument parser and a logging backend. Neither is substitutable: DecoderApp
    // uses commons-cli's org.apache.commons.cli.help package (1.10+ only) and casts the root
    // logger to ch.qos.logback.classic.Logger. No kmttg source compiles against either.
    runtimeOnly "commons-cli:commons-cli:${commonsCliVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Used to stub the Swing gui singleton for the GUI-coupled searchKeywords test.
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
    // Emit the coverage report automatically after the tests run.
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = '0.8.12'
}

// HTML report at build/reports/jacoco/test/html/index.html (+ XML for CI tools).
jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required  = true
    }
}

// One-off tool to (re)generate the RPC test fixtures from a live TiVo.
// Usage: gradlew captureRpcFixtures -PconfigDir="C:\\path\\to\\kmttg" -Ptivo=Bolt
// It connects, fetches the safe read calls, sanitizes TSN/MAK, and writes the
// JSON fixtures under src/test/resources/fixtures/. NOT part of the test suite.
tasks.register('captureRpcFixtures', JavaExec) {
    group = 'kmttg'
    description = 'Capture sanitized RPC fixtures from a live TiVo (manual)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tivo.kmttg.rpc.RpcFixtureCapture'
    if (project.hasProperty('configDir')) args(project.property('configDir'))
    if (project.hasProperty('tivo')) args(project.property('tivo'))
}

// One-off tool to (re)generate the RPC command trace fixtures from an rpc.jsonl
// capture (written by running kmttg with -rpcLog).
// Usage: gradlew rpcLogFixtures -PrpcLog="C:\path\to\rpc.jsonl" -Pcapture=2026-09-06
// The capture id picks which slices to rebuild; a slice's line numbers only
// mean anything against the rpc.jsonl they were read from - see RpcLogFixtures.
// It slices the log into the commands_*.json fixtures under
// test/resources/fixtures/. NOT part of the test suite.
tasks.register('rpcLogFixtures', JavaExec) {
    group = 'kmttg'
    description = 'Rebuild the RPC replay fixtures from an rpc.jsonl capture (manual)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tivo.kmttg.rpc.RpcLogFixtures'
    if (project.hasProperty('rpcLog')) args(project.property('rpcLog'))
    if (project.hasProperty('capture')) args(project.property('capture'))
}

application {
    // Java 8 shim that checks the JRE then hands off to com.tivo.kmttg.main.kmttg
    mainClass = 'com.tivo.kmttg.main.Launcher'
}

// kmttg uses a flat source layout (src/com/...) and bundles the images/
// directory at the jar root, so override the default source set locations.
sourceSets {
    // Java 8 launcher shim, kept out of src/ because the main source set below
    // globs all of src/ and would compile a second copy of it at release 11.
    launcher {
        java {
            srcDirs = ['src-launcher']
        }
        resources {
            // Otherwise defaults to src/launcher/resources, inside the main root
            srcDirs = []
        }
    }
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['images']
        }
    }
    test {
        // Kept out of src/ because the main source set globs all of src/.
        java {
            srcDirs = ['test/java']
        }
        resources {
            srcDirs = ['test/resources']
        }
    }
}

dependencies {
    // Test-only. main and launcher are at different bytecode levels and must
    // never compile against each other.
    testImplementation sourceSets.launcher.output
}

tasks.withType(JavaCompile).configureEach {
    // The launcher shim stays on Java 8, everything else targets Java 11
    boolean isLauncher = (name == 'compileLauncherJava')
    options.release = isLauncher ? 8 : 11
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
    if (isLauncher) {
        // Silence "source value 8 is obsolete" - targeting 8 is the point
        options.compilerArgs << '-Xlint:-options'
    }
}

// Build the runnable fat jar as release/kmttg.jar (the launcher scripts in
// release/ expect it there).
shadowJar {
    archiveFileName = 'kmttg.jar'
    destinationDirectory = file('release')
    // Adds the shim's classes, and the task dependency on launcherClasses
    from sourceSets.launcher.output
    manifest {
        attributes(
            'Main-Class'            : application.mainClass.get(),
            'Implementation-Title'  : 'kmttg',
            // Read back by Launcher.productName() for the error dialog
            'Implementation-Version': project.version.toString()
        )
    }
}

// `gradle run` uses sourceSets.main.runtimeClasspath, which doesn't include the
// launcher source set, so add it to go through the shipped entry point
tasks.named('run', JavaExec) {
    classpath += sourceSets.launcher.output
}

// `gradle build` produces the fat jar
tasks.named('build') {
    dependsOn 'shadowJar'
}

// Release distribution zip (mirrors the old ant dist-both target): zips the
// release/ folder contents, excluding user/runtime files.
tasks.register('releaseZip', Zip) {
    dependsOn 'shadowJar'
    archiveFileName = "kmttg_${version}.zip"
    destinationDirectory = file('dist')
    from('release') {
        // release/ is a working directory too - keep local scratch out of the zip
        exclude '*.ini', 'auto.*', '*.sp', '*.csv',
                '*.vmoptions', '*.log', 'kmttg-nofx.jar'
    }
    // Ship the third-party attribution notices with the distribution
    from('THIRD-PARTY.md')
}

// The shim must not ALSO be compiled by sourceSets.main, which globs all of
// src/ at release 11. Two copies of Launcher.class would race for the jar.
if (file('src/com/tivo/kmttg/main/Launcher.java').exists()) {
    throw new GradleException(
        "src/com/tivo/kmttg/main/Launcher.java must live in src-launcher/, not src/.\n" +
        "sourceSets.main globs src/ and compiles it at release 11, which defeats the shim.")
}

