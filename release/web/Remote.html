<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiVo Remote</title>
<link rel="stylesheet" href="css/pure-min.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/Remote.css">
</head>
<body>
<div id="REMOTE_LAYOUT">

 <div id="REMOTE_WRAP">
  <!-- data-event carries the RPC key event name; the id drives the skin CSS
       and the two differ for liveTv -->
  <div id="REMOTE">
   <ul>
    <li id="tivo" class="tivo" data-event="tivo"><button aria-label="TiVo"></button></li>
    <li id="livetv" class="liveTv" data-event="liveTv"><button aria-label="Live TV"></button></li>
    <li id="up" class="up" data-event="up"><button aria-label="Up"></button></li>
    <li id="down" class="down" data-event="down"><button aria-label="Down"></button></li>
    <li id="left" class="left" data-event="left"><button aria-label="Left"></button></li>
    <li id="right" class="right" data-event="right"><button aria-label="Right"></button></li>
    <li id="select" class="select" data-event="select"><button aria-label="Select"></button></li>
    <li id="info" class="info" data-event="info"><button aria-label="Info"></button></li>
    <li id="zoom" class="zoom" data-event="zoom"><button aria-label="Zoom"></button></li>
    <li id="channelUp" class="channelUp" data-event="channelUp"><button aria-label="Channel up"></button></li>
    <li id="channelDown" class="channelDown" data-event="channelDown"><button aria-label="Channel down"></button></li>
    <li id="thumbsUp" class="thumbsUp" data-event="thumbsUp"><button aria-label="Thumbs up"></button></li>
    <li id="thumbsDown" class="thumbsDown" data-event="thumbsDown"><button aria-label="Thumbs down"></button></li>
    <li id="guide" class="guide" data-event="guide"><button aria-label="Guide"></button></li>
    <li id="record" class="record" data-event="record"><button aria-label="Record"></button></li>
    <li id="play" class="play" data-event="play"><button aria-label="Play"></button></li>
    <li id="forward" class="forward" data-event="forward"><button aria-label="Fast forward"></button></li>
    <li id="reverse" class="reverse" data-event="reverse"><button aria-label="Rewind"></button></li>
    <li id="slow" class="slow" data-event="slow"><button aria-label="Slow"></button></li>
    <li id="pause" class="pause" data-event="pause"><button aria-label="Pause"></button></li>
    <li id="replay" class="replay" data-event="replay"><button aria-label="Replay"></button></li>
    <li id="advance" class="advance" data-event="advance"><button aria-label="Advance"></button></li>
    <li id="actionA" class="actionA" data-event="actionA"><button aria-label="A"></button></li>
    <li id="actionB" class="actionB" data-event="actionB"><button aria-label="B"></button></li>
    <li id="actionC" class="actionC" data-event="actionC"><button aria-label="C"></button></li>
    <li id="actionD" class="actionD" data-event="actionD"><button aria-label="D"></button></li>
    <li id="num1" class="num1" data-event="num1"><button aria-label="1"></button></li>
    <li id="num2" class="num2" data-event="num2"><button aria-label="2"></button></li>
    <li id="num3" class="num3" data-event="num3"><button aria-label="3"></button></li>
    <li id="num4" class="num4" data-event="num4"><button aria-label="4"></button></li>
    <li id="num5" class="num5" data-event="num5"><button aria-label="5"></button></li>
    <li id="num6" class="num6" data-event="num6"><button aria-label="6"></button></li>
    <li id="num7" class="num7" data-event="num7"><button aria-label="7"></button></li>
    <li id="num8" class="num8" data-event="num8"><button aria-label="8"></button></li>
    <li id="num9" class="num9" data-event="num9"><button aria-label="9"></button></li>
    <li id="num0" class="num0" data-event="num0"><button aria-label="0"></button></li>
    <li id="clear" class="clear" data-event="clear"><button aria-label="Clear"></button></li>
    <li id="enter" class="enter" data-event="enter"><button aria-label="Enter"></button></li>
    <li id="standby" class="standby" data-event="standby"><button>Standby</button></li>
    <li id="ccOn" class="ccOn" data-event="ccOn"><button>CC On</button></li>
    <li id="ccOff" class="ccOff" data-event="ccOff"><button>CC Off</button></li>
    <li id="nowShowing" class="nowShowing" data-event="nowShowing"><button>My Shows</button></li>
   </ul>
   <p id="channelLabel"></p>
  </div>
 </div>

 <div id="RIGHT">
  <p>
   <label for="TIVO">TiVo:</label>
   <select id="TIVO"></select>
  </p>
  <p>
   <button type="button" id="LAUNCH_BTN" class="pure-button">Launch App:</button>
   <select id="LAUNCH"></select>
  </p>
  <p>
   <button type="button" id="SPS_BTN" class="pure-button">SPS Backdoor:</button>
   <select id="SPS"></select>
  </p>
  <p>
   <button type="button" id="SKIPB_BTN" class="pure-button">Skip minutes back:</button>
   <input type="number" id="SKIPB" value="5" min="0" size="4">
  </p>
  <p>
   <button type="button" id="SKIPF_BTN" class="pure-button">Skip minutes ahead:</button>
   <input type="number" id="SKIPF" value="5" min="0" size="4">
  </p>
  <p>
   <button type="button" id="SKIPM_BTN" class="pure-button">Jump to minute:</button>
   <input type="number" id="SKIPM" value="0" min="0" size="4">
  </p>
 </div>

</div>
<script src="js/util.js"></script>
<script src="js/dialog.js"></script>
<script src="js/table.js"></script>
<script src="js/nav.js"></script>
<script src="js/pages/Remote.js"></script>
</body>
</html>
