<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Streaming</title>
<link rel="stylesheet" href="css/pure-min.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="toolbar">
 <label for="TIVO">TiVo:</label>
 <select id="TIVO"></select>
 <button type="button" id="MYSHOWS" class="pure-button pure-button-primary">My Shows...</button>
 <button type="button" id="BROWSEFILES" class="pure-button">Browse Files...</button>
 <button type="button" id="GetCached" class="pure-button">Get Cached...</button>
 <span class="spacer"></span>
 <label>Jobs:</label>
 <button type="button" id="ShowRunning" class="pure-button">Show Running</button>
 <button type="button" id="KILLALL" class="pure-button">Kill All</button>
</div>
<div class="toolbar">
 <label for="MAXRATE">Bit rate:</label>
 <select id="MAXRATE"></select>
 <label>Transcode type:</label>
 <label class="radio"><input type="radio" name="type" value="hls" checked> HLS (Safari, iOS, Android Chrome, Edge)</label>
 <label class="radio"><input type="radio" name="type" value="webm"> webm (Firefox, Chrome)</label>
</div>
<div id="BROWSE" class="status"></div>

<div id="NPLTABLE_DIV" class="table-wrap" hidden>
 <table id="NPLTABLE"></table>
</div>

<div id="FILETABLE_DIV" class="table-wrap" hidden>
 <table id="FILETABLE"></table>
</div>
<script src="js/util.js"></script>
<script src="js/dialog.js"></script>
<script src="js/table.js"></script>
<script src="js/nav.js"></script>
<script src="js/pages/Stream.js"></script>
</body>
</html>
